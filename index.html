<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13102a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
<title>Aventura tu Vida</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: una sola columna de app móvil (máx. 560px) con HUD pegado arriba y barra de pestañas abajo.
   Mundo nocturno de videojuego: tier list, cupones de misión, monedas y ruleta. Un solo tema oscuro, a propósito. */
:root{
  color-scheme: dark;
  --bg:#13102a; --glow:#2a2368; --panel:#1d1940; --panel-2:#28235a; --line:#3b3577; --line-strong:#544c9c;
  --ink:#f4f0ff; --muted:#aaa4d6; --faint:#726ca8; --scrim:rgba(6,4,22,.74);
  --coin:#ffc53d; --coin-hi:#fff1b8; --coin-lo:#c98a00;
  --hot:#ff6b3d; --on-hot:#1d0b03; --win:#3fe0a2; --on-win:#04261a; --ice:#7cc7ff;
  --t-s:#ff5c7a; --t-a:#ff9f43; --t-b:#ffd43b; --t-c:#69db7c; --on-tier:#1a1433;
  --a-negocio:#5cb8ff; --a-finanzas:#38d9c9; --a-gamer:#b197fc; --a-edicion:#f783ac; --a-familia:#ffa94d; --a-personal:#8ce99a;
  --f-display:"Bungee","Arial Black",Impact,system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hud:"Chakra Petch",ui-monospace,"SF Mono",Menlo,monospace;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100%;
  background:var(--bg) radial-gradient(900px 420px at 50% -160px, var(--glow) 0%, transparent 70%) no-repeat;
  color:var(--ink); font:500 15px/1.45 var(--f-body);
  padding-left:var(--gutter-l); padding-right:var(--gutter-r);
  padding-block:0 calc(92px + env(safe-area-inset-bottom, 0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--coin);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-hud);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{max-width:560px;margin:0 auto}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-fill{stroke:none}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-block:10px 8px;border-bottom:1px solid var(--line)}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lvl{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.lvl-n{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--panel-2);border:2px solid var(--coin);font:16px var(--f-display);color:var(--coin)}
.lvl-info{min-width:0}
.lvl-info b{display:block;font:700 13px var(--f-hud);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{width:110px;height:6px;border-radius:9px;background:var(--panel-2);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:var(--coin);border-radius:inherit;transition:width .6s}
.hud-stats{display:flex;gap:12px;align-items:center}
.stat{display:flex;align-items:center;gap:5px;font-weight:700}
.stat b{font-size:16px}
.coin{display:inline-block;flex:none;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 32%, var(--coin-hi), var(--coin) 52%, var(--coin-lo));box-shadow:inset 0 0 0 2px var(--coin-lo)}
.hud-sub{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font:600 12px var(--f-hud);color:var(--muted);letter-spacing:.03em}
.hud-sub b{color:var(--ink)}
.combo{color:var(--hot)}
.sync{color:var(--faint)}

/* Secciones */
main{display:flex;flex-direction:column;gap:18px;padding-top:16px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
h2,.eyebrow{margin:0;font:700 12.5px var(--f-hud);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
h3{margin:0;font-size:17px;line-height:1.25;text-wrap:balance}
p{margin:0}
.lead{color:var(--muted);max-width:60ch}
details.sec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h2::after{content:" +";color:var(--faint)}
details.sec[open]>summary h2::after{content:" −"}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:700 14px var(--f-body);border-radius:12px;padding:11px 15px;border:1px solid var(--line-strong);background:var(--panel-2);color:var(--ink);cursor:pointer;min-height:44px;transition:transform .12s, filter .12s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-hot{background:var(--hot);border-color:transparent;color:var(--on-hot)}
.btn-win{background:var(--win);border-color:transparent;color:var(--on-win)}
.btn-coin{background:var(--coin);border-color:transparent;color:var(--on-hot)}
.btn-ghost{background:transparent}
.btn-sm{min-height:36px;padding:7px 11px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.btn .ic{width:18px;height:18px}
.ico-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;flex:none}
.ico-btn:hover{color:var(--ink)}
.link{background:none;border:0;color:var(--coin);font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* Día */
.dia{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{position:relative;width:128px;height:128px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{stroke:var(--panel-2)}
.ring .fgc{stroke:var(--win);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring.low .fgc{stroke:var(--hot)}
.ring.mid .fgc{stroke:var(--coin)}
.ring-txt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-txt b{font:34px/1 var(--f-display)}
.ring-txt span{font:700 10.5px var(--f-hud);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.dia-info{display:flex;flex-direction:column;gap:8px;min-width:0}
.dia-msg{font-weight:700;font-size:16px;line-height:1.3;text-wrap:balance}
.metas-dia{display:flex;gap:6px;flex-wrap:wrap}
.md{font:700 11.5px var(--f-hud);padding:4px 8px;border-radius:8px;border:1px dashed var(--line-strong);color:var(--muted)}
.md.ok{border-style:solid;border-color:var(--win);color:var(--win)}
.estrategia{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted)}
.estrategia b{color:var(--ink)}

/* Cupón de orden */
.ticket{
  --notch:calc(100% - 66px);
  position:relative;border-radius:16px;
  background:linear-gradient(140deg, color-mix(in srgb, var(--hot) 26%, var(--panel-2)) 0%, var(--panel-2) 62%);
  -webkit-mask:radial-gradient(circle 11px at left var(--notch), #0000 97%, #000) left/51% 100% no-repeat, radial-gradient(circle 11px at right var(--notch), #0000 97%, #000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 11px at left var(--notch), #0000 97%, #000) left/51% 100% no-repeat, radial-gradient(circle 11px at right var(--notch), #0000 97%, #000) right/51% 100% no-repeat;
}
.ticket.win{background:linear-gradient(140deg, color-mix(in srgb, var(--win) 24%, var(--panel-2)) 0%, var(--panel-2) 62%)}
.ticket-top{padding:16px 18px 14px;display:flex;flex-direction:column;gap:6px}
.ticket-top .eyebrow{color:var(--hot)}
.ticket.win .eyebrow{color:var(--win)}
.orden-txt{font-size:18px;font-weight:800;line-height:1.3;text-wrap:balance}
.orden-tarea{color:var(--muted);font-weight:600}
.ticket-foot{height:66px;border-top:2px dashed color-mix(in srgb, var(--ink) 22%, transparent);display:flex;align-items:center;gap:8px;padding:0 14px;overflow-x:auto}
.ticket-foot .chips{flex-wrap:nowrap;margin:0}

/* Captura */
.captura{display:flex;flex-direction:column;gap:8px}
textarea,input,select{font:500 15px var(--f-body);background:var(--bg);color:var(--ink);border:1px solid var(--line-strong);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:54px;line-height:1.4}
textarea::placeholder,input::placeholder{color:var(--faint)}
.cap-actions{display:grid;grid-template-columns:1fr auto;gap:8px}
.aviso{font-size:13.5px;color:var(--muted);background:var(--panel);border:1px dashed var(--line-strong);border-radius:12px;padding:10px 12px}

/* Tier list */
.tiers{display:flex;flex-direction:column;gap:8px}
.tier{display:grid;grid-template-columns:46px 1fr;border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.tier-l{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--tc);color:var(--on-tier)}
.tier-l b{font:26px/1 var(--f-display)}
.tier-l small{font:700 9.5px var(--f-hud);letter-spacing:.06em}
.tier-items{display:flex;flex-direction:column;min-width:0}
.task{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 10px 10px 12px;border-top:1px solid var(--line);min-width:0}
.task:first-child{border-top:0}
.chk{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2.5px solid var(--tc, var(--line-strong));background:transparent;cursor:pointer;color:var(--on-win);padding:0}
.chk:hover{background:color-mix(in srgb, var(--tc, var(--win)) 18%, transparent)}
.chk .ic{width:18px;height:18px;stroke-width:3}
.done .chk,.chk.on{background:var(--win);border-color:var(--win)}
.task-b{background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:5px}
.task-t{font-weight:700;overflow-wrap:anywhere}
.done .task-t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font:600 11.5px var(--f-hud);padding:3px 8px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.chip-day{color:var(--coin)}
.chip-goal{color:var(--win)}
.chip-hot{color:var(--hot)}
.chip-coin{color:var(--coin)}
.chip-ej{color:var(--ice);border:1px dashed var(--ice);background:transparent}
.chip-area::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac)}
.empty{padding:18px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line-strong);border-radius:14px}
.prox{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.prox span{min-width:0;overflow-wrap:anywhere}

/* Gráfica */
.chart{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 10px 6px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font:600 9px var(--f-hud);fill:var(--faint)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .umbral{stroke:var(--coin);stroke-dasharray:3 3;stroke-width:1.2}
.chart .umbral-t{fill:var(--coin)}
.chart .bar{fill:var(--line-strong)}
.chart .bar.win{fill:var(--win)}
.chart .bar.today{fill:var(--hot)}
.chart .bar.today.win{fill:var(--win)}
.chart .nada{fill:var(--line)}

/* Metas */
.meta{--c:var(--win);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.meta.foco{border-color:color-mix(in srgb, var(--coin) 55%, var(--line))}
.m-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.m-ico{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--panel-2);font-size:24px}
.m-sub{color:var(--muted);font-size:13px;margin-top:2px}
.star{color:var(--faint)}
.star.on{color:var(--coin)}
.star.on .ic{fill:var(--coin)}
.m-big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.m-pct{font:44px/1 var(--f-display);color:var(--c)}
.m-falta{font-weight:700;color:var(--ink)}
.track{position:relative;height:14px;border-radius:999px;background:var(--panel-2);margin:18px 6px 4px}
.track>i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:linear-gradient(90deg, color-mix(in srgb, var(--c) 45%, transparent), var(--c));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.track .node{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--line-strong);transform:translate(-50%,-50%)}
.track .node.ok{background:var(--c);border-color:var(--c)}
.track .mk{position:absolute;top:50%;transform:translate(-50%,-78%);font-size:26px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));transition:left .8s cubic-bezier(.2,.8,.2,1)}
.track .meta-f{position:absolute;right:-6px;top:50%;transform:translate(0,-80%);color:var(--coin)}
.m-ritmo{font:600 13px var(--f-hud);color:var(--muted)}
.m-rutas{margin:0;padding:10px 12px;list-style:none;background:var(--panel-2);border-radius:12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.m-rutas .eyebrow{margin-bottom:2px}
.hitos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.hito{display:grid;grid-template-columns:30px 1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.hito:first-child{border-top:0}
.hito .chk{width:26px;height:26px;--tc:var(--c)}
.hito .chk .ic{width:15px;height:15px}
.hito.ok span.txt{color:var(--muted);text-decoration:line-through}
.hito span.txt{min-width:0;overflow-wrap:anywhere;font-weight:600;font-size:14px}
.hito .ico-btn{width:32px;height:32px}
.m-acc{display:flex;gap:8px;flex-wrap:wrap}
.porconf{display:flex;align-items:center;justify-content:space-between;gap:10px;background:color-mix(in srgb, var(--ice) 12%, var(--panel-2));border:1px dashed var(--ice);border-radius:12px;padding:8px 10px;font-size:13.5px;color:var(--ink)}

/* Récords */
.rec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rec-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rec-best{font:26px/1 var(--f-display);color:var(--coin)}
.rec-best small{display:block;font:700 10.5px var(--f-hud);color:var(--muted);letter-spacing:.1em;margin-bottom:6px}
.rec-form{display:grid;grid-template-columns:1fr auto;gap:8px}
.spark{width:100%;height:36px;display:block}
.spark path{fill:none;stroke:var(--coin);stroke-width:2}
.spark .area{fill:color-mix(in srgb, var(--coin) 16%, transparent);stroke:none}
.spark circle{fill:var(--coin)}

/* Premios */
.balance{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.bal b{display:block;font:24px/1.1 var(--f-display)}
.bal span{font:700 10.5px var(--f-hud);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.bal .coin{width:20px;height:20px;vertical-align:-3px}
.ruleta{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.wheel-wrap{position:relative;width:min(290px, 100%);aspect-ratio:1;max-width:100%}
.wheel-wrap canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 6px var(--panel-2), 0 0 0 8px var(--coin), 0 12px 40px rgba(0,0,0,.45)}
.wheel-ptr{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--coin);filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));z-index:2}
.wheel-hub{position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);border-radius:50%;background:var(--bg);border:3px solid var(--coin);display:grid;place-items:center;font:12px var(--f-display);color:var(--coin)}
.premio{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.premio b{display:block;overflow-wrap:anywhere}
.premio .falta{font:600 12px var(--f-hud);color:var(--muted)}
.mini-bar{height:5px;border-radius:9px;background:var(--panel-2);overflow:hidden;margin-top:6px}
.mini-bar i{display:block;height:100%;background:var(--coin)}

/* Consejo */
.voces{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.voz{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.voz b{font:14px var(--f-display);color:var(--vc)}
.voz span{font-size:13px;color:var(--muted)}
.respuesta{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;line-height:1.5;min-height:48px}
.ajuste{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ajuste:first-child{border-top:0}

/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{position:relative;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font:700 11px var(--f-body);cursor:pointer}
.tab .ic{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--coin)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--hot);color:var(--on-hot);font:700 10.5px/17px var(--f-hud);text-align:center}

/* Modales y capas */
.modal{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));padding-left:var(--gutter-l);padding-right:var(--gutter-r);display:flex;flex-direction:column;gap:14px;animation:up .22s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid var(--line);padding-bottom:20px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h3{font:18px var(--f-display);letter-spacing:.02em}
form{display:flex;flex-direction:column;gap:12px}
label,.lbl{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.seg label{display:grid;place-items:center;min-height:44px;border-radius:10px;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);font:800 15px var(--f-body);cursor:pointer;flex-direction:row}
.seg label:has(input:checked){background:var(--sc, var(--coin));color:var(--on-tier);border-color:transparent}
.seg label:has(input:focus-visible){outline:2px solid var(--coin);outline-offset:2px}
.edit-rows{display:flex;flex-direction:column;gap:8px}
.edit-row{display:grid;grid-template-columns:1fr 84px 38px;gap:6px;align-items:center}
.edit-row.r3{grid-template-columns:1fr 64px 108px 38px}
.hint{font-size:12.5px;color:var(--faint);font-weight:500}
.peligro{color:var(--t-s)}

.toasts{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:70;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.toast{background:var(--panel-2);border:1px solid var(--line-strong);padding:10px 14px;border-radius:12px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:up .25s cubic-bezier(.2,.8,.2,1);max-width:100%}
.toast.coin{border-color:var(--coin)}
.toast.hot{border-color:var(--hot)}
.toast.win{border-color:var(--win)}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}

.capa{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:var(--gutter-l);padding-right:var(--gutter-r);animation:fade .2s}
.capa .eyebrow{color:var(--hot)}
.capa-t{font:clamp(30px, 9vw, 52px)/1.05 var(--f-display);text-wrap:balance;max-width:16ch}
.capa-s{font-size:17px;color:var(--muted);max-width:36ch;text-wrap:balance}
.capa-txt{font-size:clamp(19px, 5vw, 24px);font-weight:700;line-height:1.4;max-width:30ch;text-wrap:balance}
.big-time{font:clamp(56px, 18vw, 96px)/1 var(--f-display);color:var(--coin)}
.celebra .capa-t{color:var(--coin);text-shadow:0 0 30px color-mix(in srgb, var(--coin) 50%, transparent)}
.respira{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle, color-mix(in srgb, var(--a-gamer) 70%, transparent), transparent 70%);animation:respira 10s ease-in-out infinite}
.pasos{display:flex;gap:6px}
.pasos i{width:26px;height:5px;border-radius:5px;background:var(--panel-2)}
.pasos i.on{background:var(--coin)}
#confeti{position:fixed;inset:0;pointer-events:none;z-index:80;width:100%;height:100%}

@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes respira{0%,100%{transform:scale(.7)}40%{transform:scale(1.15)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.pop{animation:pop .45s}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:380px){.ring{width:108px;height:108px}.ring-txt b{font-size:28px}.xpbar{width:84px}.hud-stats{gap:9px}}

function migrar(s) {
  const base = inicial();
  if (!s || typeof s !== 'object') return base;
  for (const k of ['metas', 'tareas', 'records', 'premios', 'canjes']) if (!Array.isArray(s[k])) s[k] = [];
  s.stats = Object.assign({}, base.stats, s.stats || {});
  s.stats.combo = Object.assign({ n: 0, last: 0 }, s.stats.combo || {});
  s.historial = s.historial && typeof s.historial === 'object' ? s.historial : {};
  s.dia = s.dia && typeof s.dia === 'object' ? s.dia : { fecha: '' };
  s.ajustes = Object.assign({}, base.ajustes, s.ajustes || {});
  for (const m of s.metas) { m.hitos = Array.isArray(m.hitos) ? m.hitos : []; m.rutas = Array.isArray(m.rutas) ? m.rutas : []; for (const k of ['inicio', 'actual', 'objetivo']) m[k] = Number(m[k]) || 0; }
  for (const r of s.records) r.hist = Array.isArray(r.hist) ? r.hist : [];
  return s;
}

let docRef = null, sample = null, sync = 'local';
let saveTimer = null, saving = false, saveAgain = false;

function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch { /* sin almacenamiento */ } }

function guardar() {
  S._rev = (S._rev || 0) + 1; S._by = TAB_ID; S._t = Date.now();
  lsSet(LS_KEY, JSON.stringify(S));
  clearTimeout(saveTimer); saveTimer = setTimeout(subir, 700);
}
async function subir() {
  if (!docRef) return;
  if (saving) { saveAgain = true; return; }
  saving = true;
  try { await docRef.set(JSON.parse(JSON.stringify(S))); setSync('nube'); }
  catch (e) { setSync(e && e.code === 'quota_exceeded' ? 'lleno' : 'error'); }
  finally { saving = false; if (saveAgain) { saveAgain = false; subir(); } }
}
function setSync(v) { sync = v; const el = $('#sync'); if (el) el.textContent = textoSync(); }
function textoSync() { return { local: 'guardado en este equipo', nube: 'sincronizado', error: 'sin conexión: guardado aquí', lleno: 'almacenamiento lleno' }[sync] || ''; }

const KW = [
  ['familia', /\b(hija|niña|colegio|jard[ií]n|familia|cumple|recoger)\b/i],
  ['gamer', /\b(stream|directo|en vivo|twitch|kick|youtube|tiktok|short|reel|gamer|seguidores|partida|clip|canal)\b/i],
  ['edicion', /\b(edit|edici[oó]n|editar|video|render|premiere|capcut|davinci|montaje|miniatura)/i],
  ['finanzas', /\b(byd|camioneta|ahorr|extracto|banco|penthouse|apartamento|deuda|pagar|factura|impuesto)/i],
  ['negocio', /\b(cliente|venta|vender|servicio|cotiza|propuesta|llamar|whatsapp|proveedor|negocio|cobrar|pedido)/i],
  ['personal', /\b(gym|gimnasio|caminar|dormir|m[eé]dico|leer|meditar|descansar|correr|almorzar)\b/i],

function detectarArea(s) { for (const [a, re] of KW) if (re.test(s)) return a; return 'personal'; }

  if (!m) return 0;
  const base = Number(m[1].replace(/[.,](?=\d{3}\b)/g, '').replace(',', '.')) || 0;
  const u = (m[2] || '').toLowerCase();
  const mult = /^(mil|k)$/.test(u) ? 1e3 : /^(m|millones|mill[oó]n)$/.test(u) ? 1e6 : 1;
  return Math.round(base * mult);
}

  return partes.map(p => {
    const area = detectarArea(p);

    if (/penthouse|byd|camioneta/i.test(p) && metaDe('byd')) metaId = 'byd';
    else { const ms = S.metas.filter(m => m.area === area && pctMeta(m) < 100); if (ms.length === 1) metaId = ms[0].id; }
    const meta = metaDe(metaId);
    let monto = detectarMonto(p);
    if (!(meta && meta.tipo === 'numero' && meta.unidad === 'COP')) monto = 0;

    if (mm) minutos = +mm[1]; else if (hh) minutos = Math.round(parseFloat(hh[1].replace(',', '.')) * 60);

function hud() {

    <button class="lvl" data-act="tab" data-tab="premios" aria-label="Nivel ${lv}, ${titulo(lv)}">
      <span class="lvl-n">${lv}</span>
      <span class="lvl-info"><b>${titulo(lv)}</b><span class="xpbar" title="${fmtNum.format(S.stats.xp - base)} de ${fmtNum.format(sig - base)} XP para el nivel ${lv + 1}"><i style="width:${p}%"></i></span></span>

function anillo(pct) {

    <svg viewBox="0 0 120 120"><circle class="bgc" cx="60" cy="60" r="${r}" fill="none" stroke-width="12"/><circle class="fgc" cx="60" cy="60" r="${r}" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
    <div class="ring-txt"><b>${Math.round(pct)}%</b><span>del día</span></div>
  </div>`;

function mensajeDia(p, pend) {

  const metas = [[50, 'desbloquear la ruleta', !S.dia.r50], [S.ajustes.umbral, 'ganar el día y proteger tu racha', !S.dia.ganado], [100, 'el día perfecto y otro giro', !S.dia.r100]];
  for (const [lim, txt, activo] of metas) {

      for (const t of pend) { if (ok / p.tot * 100 >= lim) break; ok += pesoT(t); n++; }

function filaTarea(t, p) {

function proximos() {

function grafica() {

  s += `<line class="umbral" x1="${pl}" x2="${W}" y1="${y(u)}" y2="${y(u)}"/><text class="umbral-t" x="${W}" y="${y(u) - 3}" text-anchor="end">${u}% = día ganado</text>`;
  for (let i = 0; i < n; i++) {

    const v = esHoy ? progreso(tareasDelDia(k)).pct : (S.historial[k] ? S.historial[k].pct : null);

    else { const yy = y(Math.max(v, 2)); s += `<rect class="bar ${v >= u ? 'win' : ''} ${esHoy ? 'today' : ''}" x="${x}" y="${yy}" width="${w}" height="${y(0) - yy}" rx="3"><title>${k}: ${Math.round(v)}%</title></rect>`; }
    s += `<text x="${x + w / 2}" y="${H - 4}" text-anchor="middle">${esHoy ? 'hoy' : 'LMMJVSD'[(d.getDay() + 6) % 7]}</text>`;
  }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Porcentaje logrado cada día en las últimas dos semanas">${s}</svg></div>`;

function spark(vals) {
  if (vals.length < 2) return '';
  const W = 300, H = 36, mx = Math.max(...vals), mn = Math.min(...vals), sp = (mx - mn) || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * (W - 6) + 3, H - 4 - (v - mn) / sp * (H - 8)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="area" d="${d} L${last[0].toFixed(1)} ${H} L3 ${H} Z"/><path d="${d}"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3"/></svg>`;
}

/* ---------- replaneo ---------- */
async function replan(fd, btn) {
  const cambio = String(fd.get('cambio') || '').trim(); const energia = fd.get('energia') || 'media'; const horas = clamp(+fd.get('horas') || 4, 0.5, 16);
  const pend = ordenar(tareasDelDia(hoy()).filter(t => !t.hecha && !t.sistema));
  if (sample) {
    btn.disabled = true; btn.textContent = 'El Consejo está reorganizando…';
    try {
      const r = await sample.json(`${PERSONA}\n\n${contextoIA()}\n\nEl día cambió. Lo que cambió: "${cambio.slice(0, 1500) || 'nada en especial, solo quiero un mejor orden'}". Energía ahora: ${energia}. Horas disponibles para trabajar hoy: ${horas}.\nReorganiza: pon en "orden" TODAS las tareas pendientes que sí caben hoy, en el orden en que debe hacerlas, cada una con su voz y una orden corta (máx. 110 caracteres). Pon en "manana" los ids que no caben o que conviene mover. Si el cambio exige tareas nuevas, ponlas en "nuevas". "estrategia": 1 o 2 frases que expliquen la jugada del día.\nResponde SOLO con JSON: {"estrategia":"…","orden":[{"id":"…","voz":"ceo","orden":"…"}],"manana":["id"],"nuevas":[${FORMA_TAREA}]}`, { cache: false });
      aplicarReplan(r, pend);
      return;
    } catch (e) {
      const msg = errorIA(e); if (msg) toast(msg, 'hot');
      if (!e || e.code === 'cancelled') return;
    } finally { btn.disabled = false; }
  }
  // Sin IA: llena el tiempo disponible por puntaje; con energía baja, primero lo corto e importante.
  const cap = horas * 60; let usado = 0; const quedan = [], mover = [];
  const lista = energia === 'baja' ? [...pend].sort((a, b) => (puntaje(b) - (b.minutos > 45 ? 5 : 0)) - (puntaje(a) - (a.minutos > 45 ? 5 : 0))) : pend;
  // Lo de su hija y lo urgente nunca se mueve: ocupa tiempo primero y el resto se acomoda.
  const fija = t => t.area === 'familia' || (t.urgencia || 0) >= 5;
  for (const t of lista) if (fija(t)) { quedan.push(t); usado += t.minutos || 30; }
  for (const t of lista) { if (fija(t)) continue; const mins = t.minutos || 30; if (usado + mins <= cap || !quedan.length) { quedan.push(t); usado += mins; } else mover.push(t); }
  quedan.sort((a, b) => lista.indexOf(a) - lista.indexOf(b));
  const estr = `${quedan.length} tareas caben en tus ${fmtDec.format(horas)} h${energia === 'baja' ? ', empezando por lo corto e importante' : ''}.${mover.length ? ` Sugiero pasar ${mover.length} a mañana.` : ''}`;
  aplicarReplan({ estrategia: estr, orden: quedan.map(t => ({ id: t.id })), manana: mover.map(t => t.id), nuevas: [] }, pend);
}
function aplicarReplan(r, pend) {
  const h = hoy(); const ids = new Set(pend.map(t => t.id));
  let i = 0;
  for (const o of (r && Array.isArray(r.orden) ? r.orden : [])) {
    const t = o && ids.has(o.id) ? tareaDe(o.id) : null; if (!t) continue;
    t.rank = i++; t.rankDia = h; delete t.saltada;
    if (o.voz && VOCES[o.voz]) t.voz = o.voz;
    if (o.orden) t.orden = String(o.orden).slice(0, 160);
  }
  const mover = (r && Array.isArray(r.manana) ? r.manana : []).filter(id => ids.has(id));
  let nuevas = 0;
  for (const n of (r && Array.isArray(r.nuevas) ? r.nuevas : []).map(normalizarTarea).filter(Boolean)) { const t = crearTarea(n); t.rank = i++; t.rankDia = h; nuevas++; }
  S.dia.estrategia = String((r && r.estrategia) || '').slice(0, 400);
  guardar(); cerrarModal(); render();
  if (mover.length) {
    abrirModal('¿Pasar a mañana?', `<p>El Consejo sugiere mover estas ${mover.length} tareas a mañana:</p>
      <div class="sec">${mover.map(id => `<div class="prox"><span>${esc(tareaDe(id).texto)}</span></div>`).join('')}</div>
      <div class="row"><button class="btn btn-hot" data-act="mover-manana" data-ids="${esc(mover.join(','))}">Mover a mañana</button><button class="btn" data-act="cerrar">Dejarlas hoy</button></div>`);
  } else toast(`${ICON.check} Día reorganizado${nuevas ? ` · ${nuevas} tareas nuevas` : ''}`, 'win');
}

/* ---------- desglosar una meta ---------- */
async function desglosar(m) {
  if (!sample) {
    abrirModal('Desglosar meta', `<p class="muted">El desglose con IA funciona cuando abres la app dentro de Claude. Mientras tanto, esta plantilla sirve para cualquier meta:</p>
    <ul class="hitos">${['Definir el número exacto y la fecha', 'Dar el primer paso de 15 minutos', 'Llegar al primer 10%', 'Llegar a la mitad', 'Cerrar y celebrar'].map(x => `<li class="hito"><span></span><span class="txt">${x}</span><span></span><span></span></li>`).join('')}</ul>
    <button class="btn btn-hot" data-act="plantilla-hitos" data-id="${m.id}">Usar esta plantilla</button>`);
    return;
  }
  abrirModal('Desglosar meta', `<p class="respuesta" id="desg">El Consejo está partiendo “${esc(m.nombre)}” en pasos…</p>`);
  try {
    const r = await sample.json(`${PERSONA}\n\n${contextoIA()}\n\nDesglosa la meta id=${m.id} "${m.nombre}" (${m.tipo === 'numero' ? `va ${fmtVal(m.actual, m.unidad)} de ${fmtVal(m.objetivo, m.unidad)}` : 'se mide por hitos'}). Por qué la quiere: ${m.porque || 'no lo dijo'}.\nDame de 4 a 7 hitos concretos y medibles, en orden, con "peso" (sumando 100); si un hito mete dinero o número a la meta, pon "monto". Luego 3 tareas para empezar HOY o mañana (cada una con "hito": índice del hito que avanza, empezando en 0). También "vision" (2 frases en presente, sensoriales), "obstaculo" (el obstáculo interno más probable) y "plan" (Si…, entonces…).\nResponde SOLO con JSON: {"hitos":[{"texto":"…","peso":20,"monto":null}],"tareas":[{"texto":"…","area":"…","impacto":4,"urgencia":3,"minutos":30,"voz":"ceo","orden":"…","hito":0}],"vision":"…","obstaculo":"…","plan":"…"}`, { cache: false });
    const hitos = (r && Array.isArray(r.hitos) ? r.hitos : []).filter(h => h && h.texto).slice(0, 8).map(h => ({ id: uid(), texto: String(h.texto).slice(0, 100), peso: clamp(Math.round(+h.peso || 0), 0, 100), hecho: false, monto: Number(h.monto) > 0 ? Math.round(+h.monto) : 0 }));

/* ---------- ruleta ---------- */
let rotRueda = 0, girando = false;
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#888'; }
function dibujarRuleta() {
  const cv = $('#rueda'); if (!cv) return; const ctx = cv.getContext('2d'); const R = cv.width / 2; const seg = Math.PI * 2 / RULETA.length;
  ctx.clearRect(0, 0, cv.width, cv.height);
  RULETA.forEach((p, i) => {
    const a0 = -Math.PI / 2 + i * seg;
    ctx.beginPath(); ctx.moveTo(R, R); ctx.arc(R, R, R, a0, a0 + seg); ctx.closePath(); ctx.fillStyle = cssVar(p.c); ctx.fill();
    ctx.strokeStyle = cssVar('--bg'); ctx.lineWidth = 4; ctx.stroke();

    ctx.font = `${p.l.length > 5 ? 30 : 38}px Bungee, "Arial Black", sans-serif`; ctx.fillText(p.l, R - 26, 0); ctx.restore();
  });
  cv.style.transition = 'none'; cv.style.transform = `rotate(${rotRueda}deg)`;
}

  rotRueda = rotRueda - (rotRueda % 360) + 360 * 6 + (360 - (i * seg + seg / 2));

/* ---------- efectos ---------- */
let actx = null;
function sonar(tipo) {
  if (!S.ajustes.sonido) return;
  const seqs = { ok: [[523, .12, 0], [784, .18, .09]], coin: [[988, .08, 0], [1319, .22, .07]], win: [[523, .14, 0], [659, .14, .12], [784, .14, .24], [1047, .35, .36]], jackpot: [[784, .1, 0], [988, .1, .08], [1175, .1, .16], [1568, .45, .24]], tick: [[1400, .03, 0]] };
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    for (const [f, d, at] of seqs[tipo] || []) {
      const o = actx.createOscillator(), g = actx.createGain(); o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + at); g.gain.exponentialRampToValueAtTime(tipo === 'tick' ? 0.05 : 0.16, t0 + at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + d);
      o.connect(g).connect(actx.destination); o.start(t0 + at); o.stop(t0 + at + d + 0.03);
    }
  } catch { /* sin audio */ }
}

  const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;

  const ps = Array.from({ length: 140 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 26, vy: -Math.random() * 26 - 8, r: (Math.random() * 6 + 4) * devicePixelRatio, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, va: (Math.random() - .5) * .4 }));
  const t0 = performance.now();

    for (const p of ps) { p.vy += 0.9; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }
    if (t - t0 < 2600) requestAnimationFrame(f); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
  })(t0);
}

    celebrar('¡Premio canjeado!', `${p.nombre}. Disfrútalo sin culpa: te lo ganaste.`);
  },
  'nuevo-premio': () => abrirModal('Nuevo premio', `<form data-form="premio"><label>Premio<input id="f-pn" name="nombre" required maxlength="80" placeholder="Algo que de verdad quieras"></label><label>Costo en monedas<input name="costo" type="number" min="10" step="10" value="300" required></label><span class="hint">Referencia: un buen día da entre 150 y 300 monedas.</span><button class="btn btn-hot">Agregar a la tienda</button></form>`),
  'editar-premio': el => { const p = S.premios.find(x => x.id === el.dataset.id); if (!p) return; abrirModal('Editar premio', `<form data-form="premio" data-id="${p.id}"><label>Premio<input name="nombre" value="${esc(p.nombre)}" required maxlength="80"></label><label>Costo en monedas<input name="costo" type="number" min="10" step="10" value="${p.costo}" required></label><button class="btn btn-hot">Guardar</button><button type="button" class="btn btn-ghost peligro" data-act="borrar-premio" data-id="${p.id}">Borrar premio</button></form>`); },
  'borrar-premio': el => { S.premios = S.premios.filter(p => p.id !== el.dataset.id); guardar(); cerrarModal(); render(); },
  'comprar-comodin': () => { if (S.stats.monedas < COSTO_COMODIN) return; S.stats.monedas -= COSTO_COMODIN; S.stats.comodines++; guardar(); render(); toast(`${ICON.shield} Comodín comprado. Tienes ${S.stats.comodines}.`, 'win'); },
  'preguntar': el => { const q = ($('#preg') || {}).value || ''; if (!q.trim()) { toast('Escribe tu pregunta primero.', 'hot'); return; } preguntarConsejo(`Pregunta: ${q.trim().slice(0, 2000)}\n\nResponde en máximo 180 palabras, con órdenes concretas para hoy o esta semana. Di qué voz habla en cada orden.`, el); },
  'semana': el => preguntarConsejo(`${resumenSemana()}\n\nHaz la revisión semanal en máximo 220 palabras: 1) qué salió bien, 2) dónde se fugó la energía o el tiempo, 3) tres órdenes para la próxima semana, cada una con su voz y con el % de meta que mueve.`, el),
  'sonido': () => { S.ajustes.sonido = !S.ajustes.sonido; guardar(); render(); if (S.ajustes.sonido) sonar('coin'); },
  'exportar': () => {
    const json = JSON.stringify(S);
    abrirModal('Copia de seguridad', `<p class="muted">Copia este texto y guárdalo en un lugar seguro (notas, correo, Drive).</p><textarea id="f-exp" rows="8" readonly>${esc(json)}</textarea><button class="btn btn-hot" data-act="copiar">Copiar</button>`);
  },
  'copiar': () => { const ta = $('#f-exp'); const txt = ta.value; navigator.clipboard && navigator.clipboard.writeText(txt).then(() => toast('Copiado.', 'win')).catch(() => { ta.select(); toast('Selecciónalo y cópialo a mano.', 'hot'); }); if (!navigator.clipboard) { ta.select(); toast('Selecciónalo y cópialo a mano.', 'hot'); } },
  'importar': () => abrirModal('Importar copia', `<form data-form="importar"><label>Pega aquí tu copia de seguridad<textarea id="f-imp" name="json" rows="8" required></textarea></label><span class="hint">Esto reemplaza todo lo que hay ahora.</span><button class="btn btn-hot">Importar</button></form>`),
  'reiniciar': () => abrirModal('¿Borrar todo?', `<p>Se borran tus metas, tareas, monedas y récords, y vuelves a la configuración inicial. No se puede deshacer.</p><div class="row"><button class="btn btn-hot peligro" data-act="reiniciar-si">Sí, empezar de cero</button><button class="btn" data-act="cerrar">Cancelar</button></div>`),
  'reiniciar-si': () => { S = inicial(); rollover(); guardar(); cerrarModal(); tabActual = 'hoy'; render(); },
  'foco-hecho': () => { const id = enfoque && enfoque.id; salirEnfoque(); if (id) completar(id); reanudarCelebra(); },
  'foco-pausa': el => { if (!enfoque) return; if (enfoque.pausa != null) { enfoque.fin = Date.now() + enfoque.pausa; enfoque.pausa = null; el.textContent = 'Pausa'; } else { enfoque.pausa = Math.max(0, enfoque.fin - Date.now()); el.textContent = 'Seguir'; } },
  'foco-mas': () => { if (!enfoque) return; if (enfoque.pausa != null) enfoque.pausa += 5 * 60e3; else enfoque.fin = Math.max(enfoque.fin, Date.now()) + 5 * 60e3; enfoque.avisado = false; const msg = $('#f-msg'); if (msg) msg.textContent = '5 minutos más. Tú puedes.'; },
  'foco-salir': () => { salirEnfoque(); reanudarCelebra(); },
  'celebra-ok': () => { cerrarModal(); siguienteCelebra(); },
  'cerrar': () => { ctlIA && ctlIA.abort(); cerrarModal(); },
  'cerrar-fondo': (el, e) => { if (e.target === el) cerrarModal(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.dataset.act !== 'cerrar-fondo') e.preventDefault();
  f(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !$('#capa-modal').firstChild) return;
  if ($('#capa-modal .celebra')) { cerrarModal(); siguienteCelebra(); return; }
  if (enfoque) salirEnfoque(); else if (visual) { visual = null; cerrarModal(); } else { ctlIA && ctlIA.abort(); cerrarModal(); }
  reanudarCelebra();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.change === 'umbral') { S.ajustes.umbral = +el.value; guardar(); render(); }
  if (el.dataset.change === 'meta-hitos') { const sel = $('#f-hito'); if (sel) sel.innerHTML = opcionesHito(el.value, ''); }
});
document.addEventListener('submit', e => {
  const f = e.target; const tipo = f.dataset.form; if (!tipo) return;
  e.preventDefault();
  const fd = new FormData(f); const id = f.dataset.id;
  if (tipo === 'tarea') {
    const [imp, urg] = PRESET_TIER[fd.get('tier')] || [3, 3];
    const metaId = fd.get('metaId') || null; const m = metaDe(metaId);
    const datos = { texto: String(fd.get('texto')).trim().slice(0, 120), area: fd.get('area'), minutos: clamp(+fd.get('minutos') || 30, 5, 480), metaId, hitoId: (m && m.hitos.some(h => h.id === fd.get('hitoId'))) ? fd.get('hitoId') : null, monto: Math.max(0, Math.round(+fd.get('monto') || 0)), fecha: fd.get('fecha') || hoy() };
    if (!datos.texto) return;
    const t = id ? tareaDe(id) : null;
    if (t) {
      const cambioTier = tierDe(t).t !== fd.get('tier');
      const montoAntes = t.hecha ? (t.monto || 0) : 0; const textoAntes = t.texto;
      if (t.hecha) { datos.metaId = t.metaId; datos.hitoId = t.hitoId; }
      Object.assign(t, datos); if (cambioTier) { t.impacto = imp; t.urgencia = urg; }
      if (t.hecha && m && m.tipo === 'numero' && montoAntes !== t.monto) m.actual += t.monto - montoAntes;
      if (t.texto !== textoAntes) delete t.orden;
      delete t.ejemplo;
    } else crearTarea(Object.assign(datos, { impacto: imp, urgencia: urg }));
    guardar(); cerrarModal(); render();
    if (!t) toast(`${ICON.check} En tu tier list`, 'win');
  } else if (tipo === 'meta') {
    const nombres = fd.getAll('hito-t'), pesos = fd.getAll('hito-p'), montos = fd.getAll('hito-m'), hids = fd.getAll('hito-id');
    const prev = id ? metaDe(id) : null;
    const hitos = nombres.map((t, i) => ({ t: String(t).trim(), i })).filter(x => x.t).map(({ t, i }) => { const old = prev && prev.hitos.find(h => h.id === hids[i]); return { id: hids[i] || uid(), texto: t.slice(0, 100), peso: clamp(+pesos[i] || 0, 0, 100), monto: Math.max(0, +montos[i] || 0), hecho: old ? !!old.hecho : false }; });
    const rn = fd.getAll('ruta-n'), rv = fd.getAll('ruta-v');
    const rutas = rn.map((n, i) => ({ id: uid(), nombre: String(n).trim().slice(0, 60), valor: Math.max(0, +rv[i] || 0) })).filter(r => r.nombre);
    const datos = { nombre: String(fd.get('nombre')).trim().slice(0, 80), icono: String(fd.get('icono') || '').trim().slice(0, 4) || '🏆', area: fd.get('area'), tipo: fd.get('tipo'), unidad: String(fd.get('unidad') || '').trim().slice(0, 20), fecha: fd.get('fecha') || '', inicio: +fd.get('inicio') || 0, actual: +fd.get('actual') || 0, objetivo: +fd.get('objetivo') || 0, hitos, rutas, porque: fd.get('porque'), vision: fd.get('vision'), obstaculo: fd.get('obstaculo'), plan: fd.get('plan'), premio: fd.get('premio') };
    if (datos.tipo === 'numero' && !(datos.objetivo > datos.inicio)) { toast('La meta tiene que ser mayor que el punto de partida.', 'hot'); return; }
    if (datos.tipo === 'hitos' && !hitos.length) { toast('Agrega al menos un hito.', 'hot'); return; }
    let antes = null;
    if (prev) { antes = pctMeta(prev); Object.assign(prev, datos); prev.porConfigurar = false; if (pctMeta(prev) < antes) { prev.decil = Math.floor(pctMeta(prev) / 10); antes = null; } }
    else S.metas.push(Object.assign({ id: uid(), foco: false, decil: 0 }, datos));
    cerrarModal();
    if (prev && antes != null) revisarMeta(prev, antes);
    guardar(); render();
  } else if (tipo === 'avance') {
    const m = metaDe(id); const v = +fd.get('cant'); if (!m || !isFinite(v)) return;
    const antes = pctMeta(m);
    m.actual = fd.get('modo') === 'total' ? v : m.actual + v;
    m.porConfigurar = false;
    if (v > 0 || fd.get('modo') === 'total') { S.stats.monedas += 20; S.stats.xp += 20; }
    guardar(); cerrarModal(); render(); sonar('coin');
    toast(`${ICON.up} ${esc(m.nombre)}: ${fmtDec.format(pctMeta(m))}% · +20`, 'win');
    revisarMeta(m, antes); guardar(); render();
  } else if (tipo === 'replan') {
    replan(fd, f.querySelector('button:not([type=button])'));
  } else if (tipo === 'record') {
    const r = S.records.find(x => x.id === id); const v = +fd.get('v'); if (!r || !isFinite(v)) return;
    r.hist.push({ f: hoy(), v }); if (r.hist.length > 60) r.hist = r.hist.slice(-60);
    const rompio = v > r.mejor && r.mejor > 0; const primero = r.mejor === 0 && v > 0;
    if (v > r.mejor) r.mejor = v;
    if (rompio) { S.stats.monedas += 100; S.stats.giros++; celebrar('¡Nuevo récord!', `${r.nombre}: ${fmtVal(v, r.unidad)}. +100 monedas y un giro de ruleta.`); sumarXP(100); }
    else { S.stats.monedas += 10; S.stats.xp += 10; toast(primero ? `${ICON.trophy} Primera marca registrada. Ahora a romperla.` : `Registrado. Te faltan ${esc(fmtVal(r.mejor - v, r.unidad))} para el récord.`, 'coin'); }
    f.reset(); guardar(); render();
  } else if (tipo === 'nuevo-record') {
    S.records.push({ id: uid(), nombre: String(fd.get('nombre')).trim().slice(0, 80), unidad: String(fd.get('unidad') || '').trim().slice(0, 20), mejor: Math.max(0, +fd.get('mejor') || 0), hist: [] });
    guardar(); cerrarModal(); render();
  } else if (tipo === 'editar-record') {
    const r = S.records.find(x => x.id === id); if (!r) return;
    r.nombre = String(fd.get('nombre')).trim().slice(0, 80); r.unidad = String(fd.get('unidad') || '').trim().slice(0, 20); r.mejor = Math.max(0, +fd.get('mejor') || 0);
    guardar(); cerrarModal(); render();
  } else if (tipo === 'premio') {
    const datos = { nombre: String(fd.get('nombre')).trim().slice(0, 80), costo: Math.max(10, Math.round(+fd.get('costo') || 10)) };
    const p = id && S.premios.find(x => x.id === id);
    if (p) Object.assign(p, datos); else S.premios.push(Object.assign({ id: uid() }, datos));
    S.premios.sort((a, b) => a.costo - b.costo);
    guardar(); cerrarModal(); render();
  } else if (tipo === 'importar') {
    try {
      const o = JSON.parse(String(fd.get('json')));
      if (!o || !Array.isArray(o.metas) || !Array.isArray(o.tareas)) throw new Error('forma');
      S = migrar(o); S._t = 0; rollover(); guardar(); cerrarModal(); render(); toast('Copia importada.', 'win');
    } catch { toast('Ese texto no es una copia válida de Aventura tu Vida.', 'hot'); }
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S && S.dia.fecha !== hoy()) { rollover(); guardar(); render(); } });

/* ---------- arranque ---------- */
function arrancar() {
  let guardado = null; try { guardado = JSON.parse(lsGet(LS_KEY) || 'null'); } catch { guardado = null; }
  S = migrar(guardado || inicial());
  const nuevo = !guardado;
  rollover();
  const h = (location.hash || '').slice(1);
  tabActual = TABS.some(t => t[0] === h) ? h : (TABS.some(t => t[0] === lsGet(LS_TAB)) ? lsGet(LS_TAB) : 'hoy');
  if (nuevo) S._t = 0; else lsSet(LS_KEY, JSON.stringify(S));
  render();
  conectarClaude();
}
arrancar();
})();
</script>

</body>
